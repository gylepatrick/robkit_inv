<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>RobKit Borrowers</title>

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <div class="topbar py-3">
      <div class="container-fluid px-4">
        <div
          class="d-flex justify-content-between align-items-center flex-wrap gap-2"
        >
          <div>
            <h1>
              <i class="bi bi-people me-2" style="color: var(--gold)"></i
              >Borrowers
            </h1>
            <div class="tagline">who has what, why, and when it's due back</div>
          </div>
          <a class="btn btn-outline-copper" href="inventory.html">
            <i class="bi bi-arrow-left me-1"></i>Back to inventory
          </a>
        </div>
      </div>
    </div>

    <div class="container-fluid px-4 py-4">
      <!-- STATS -->
      <div class="row g-3 mb-3">
        <div class="col-6 col-md-3">
          <div class="stat-card accent">
            <div class="stat-icon"><i class="bi bi-arrow-left-right"></i></div>
            <div class="num" id="statActive">0</div>
            <div class="lbl">Active Loans</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card">
            <div class="stat-icon"><i class="bi bi-boxes"></i></div>
            <div class="num" id="statUnits">0</div>
            <div class="lbl">Units Out</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card warn">
            <div class="stat-icon"><i class="bi bi-clock-history"></i></div>
            <div class="num" id="statSoon">0</div>
            <div class="lbl">Due in 3 Days</div>
          </div>
        </div>
        <div class="col-6 col-md-3">
          <div class="stat-card bad">
            <div class="stat-icon">
              <i class="bi bi-exclamation-octagon"></i>
            </div>
            <div class="num" id="statOverdue">0</div>
            <div class="lbl">Overdue</div>
          </div>
        </div>
      </div>

      <!-- TOOLBAR -->
      <div class="toolbar p-3 mb-3">
        <div class="row g-2 align-items-center">
          <div class="col-12 col-md-6">
            <div class="input-group">
              <span
                class="input-group-text"
                style="
                  background: var(--panel-2);
                  border-color: var(--line);
                  color: var(--ink-dim);
                "
              >
                <i class="bi bi-search"></i>
              </span>
              <input
                type="text"
                class="form-control"
                id="searchInput"
                placeholder="Search borrower, item, purpose..."
              />
            </div>
          </div>
          <div class="col-6 col-md-4">
            <select class="form-select" id="statusFilter">
              <option value="">All loans</option>
              <option value="overdue">Overdue</option>
              <option value="soon">Due soon</option>
              <option value="ok">On time</option>
            </select>
          </div>
          <div class="col-6 col-md-2">
            <button
              class="btn btn-outline-copper w-100"
              onclick="clearFilters()"
            >
              <i class="bi bi-x-circle me-1"></i>Clear
            </button>
          </div>
        </div>
      </div>

      <!-- LOANS TABLE -->
      <div class="bench-table">
        <div class="table-responsive">
          <table class="table mb-0">
            <thead>
              <tr>
                <th>Ref</th>
                <th>Borrower</th>
                <th>Item</th>
                <th>Qty</th>
                <th>Borrowed</th>
                <th>Return by</th>
                <th>Purpose</th>
                <th class="text-end">Action</th>
              </tr>
            </thead>
            <tbody id="loansBody"></tbody>
          </table>
        </div>

        <div id="emptyState" class="empty-state d-none">
          <i class="bi bi-emoji-smile d-block mb-2"></i>
          <div class="mb-1" style="font-weight: 600" id="emptyTitle">
            Nothing is borrowed right now
          </div>
          <div class="mono" style="font-size: 0.82rem">
            Loans show up here when someone borrows a reusable item.
          </div>
        </div>
      </div>
    </div>

    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1080">
      <div
        id="toastMsg"
        class="toast align-items-center text-bg-dark border-0"
        role="alert"
      >
        <div class="d-flex">
          <div class="toast-body" id="toastBody"></div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast"
          ></button>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      const $ = (id) => document.getElementById(id);

      const SUPABASE_URL = "https://tnvofnpkqoaituwkzxcm.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRudm9mbnBrcW9haXR1d2t6eGNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyMzYwNTMsImV4cCI6MjA5OTgxMjA1M30._qAitIIaFr5MTbgof3MZuF19kG2W4IZnvu3A4yXL1sg";

      const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
      );

      const SOON_DAYS = 3;
      let loans = [];
      let toast;

      function showToast(msg) {
        $("toastBody").textContent = msg;
        toast.show();
      }

      function escapeHtml(value) {
        const div = document.createElement("div");
        div.textContent = value || "";
        return div.innerHTML;
      }

      /* Days from today until the due date (negative = overdue, null = no due date) */
      function daysUntil(dueDate) {
        if (!dueDate) return null;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const due = new Date(dueDate + "T00:00:00");
        return Math.round((due - today) / 86400000);
      }

      function loanStatus(loan) {
        const d = daysUntil(loan.dueDate);
        if (d === null) return "ok";
        if (d < 0) return "overdue";
        if (d <= SOON_DAYS) return "soon";
        return "ok";
      }

      function dueLabel(loan) {
        const d = daysUntil(loan.dueDate);
        if (d === null) return "No due date";
        if (d < 0)
          return `${Math.abs(d)} day${Math.abs(d) === 1 ? "" : "s"} overdue`;
        if (d === 0) return "Due today";
        if (d === 1) return "Due tomorrow";
        return `In ${d} days`;
      }

      function fmtDate(str) {
        if (!str) return "—";
        return new Date(str + "T00:00:00").toLocaleDateString("en-GB", {
          day: "2-digit",
          month: "short",
          year: "numeric",
        });
      }

      async function loadLoans() {
        const { data, error } = await supabaseClient
          .from("loans")
          .select("*")
          .order("due_date", { ascending: true, nullsFirst: false });

        if (error) {
          console.error("Load loans failed:", error);
          showToast("Could not load loans.");
          loans = [];
          return;
        }

        loans = data.map((r) => ({
          id: r.id,
          itemId: r.item_id,
          itemRef: r.item_ref,
          itemName: r.item_name,
          borrower: r.borrower,
          qty: r.qty,
          date: r.date,
          dueDate: r.due_date,
          purpose: r.purpose,
        }));
      }

      function render() {
        const search = $("searchInput").value.trim().toLowerCase();
        const statusFilter = $("statusFilter").value;

        /* Stats use all loans, not the filtered list */
        $("statActive").textContent = loans.length;
        $("statUnits").textContent = loans.reduce(
          (s, l) => s + Number(l.qty || 0),
          0,
        );
        $("statSoon").textContent = loans.filter(
          (l) => loanStatus(l) === "soon",
        ).length;
        $("statOverdue").textContent = loans.filter(
          (l) => loanStatus(l) === "overdue",
        ).length;

        const filtered = loans.filter((l) => {
          if (statusFilter && loanStatus(l) !== statusFilter) return false;
          if (search) {
            const hay = [l.borrower, l.itemName, l.itemRef, l.purpose]
              .join(" ")
              .toLowerCase();
            if (!hay.includes(search)) return false;
          }
          return true;
        });

        const body = $("loansBody");
        const empty = $("emptyState");

        if (filtered.length === 0) {
          body.innerHTML = "";
          empty.classList.remove("d-none");
          $("emptyTitle").textContent =
            loans.length === 0
              ? "Nothing is borrowed right now"
              : "No loans match your filters";
          return;
        }

        empty.classList.add("d-none");
        body.innerHTML = filtered
          .map((l) => {
            const status = loanStatus(l);
            return `
          <tr class="${status === "overdue" ? "is-overdue" : ""}">
            <td><span class="ref-badge">${escapeHtml(l.itemRef)}</span></td>
            <td><div class="loan-borrower">${escapeHtml(l.borrower) || "Unspecified"}</div></td>
            <td><div class="item-name">${escapeHtml(l.itemName)}</div></td>
            <td class="mono fw-bold">${l.qty}</td>
            <td class="loan-date">${fmtDate(l.date)}</td>
            <td>
              <div class="loan-date">${fmtDate(l.dueDate)}</div>
              <span class="status-${status}">
                <span class="status-dot"></span>
                <span class="status-text">${dueLabel(l)}</span>
              </span>
            </td>
            <td class="loan-purpose">${escapeHtml(l.purpose) || '<span class="text-secondary">—</span>'}</td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-copper" onclick="returnLoan('${l.id}')">
                <i class="bi bi-arrow-return-left me-1"></i>Return
              </button>
            </td>
          </tr>`;
          })
          .join("");
      }

      async function returnLoan(loanId) {
        const loan = loans.find((l) => l.id === loanId);
        if (!loan) return;
        if (
          !confirm(
            `Mark ${loan.qty} × ${loan.itemName} as returned by ${loan.borrower || "borrower"}?`,
          )
        )
          return;

        /* Fetch the live quantity so concurrent changes aren't overwritten */
        const { data: itemRow } = await supabaseClient
          .from("items")
          .select("qty")
          .eq("id", loan.itemId)
          .maybeSingle();

        if (itemRow) {
          const newQty = Number(itemRow.qty) + Number(loan.qty);
          const { error } = await supabaseClient
            .from("items")
            .update({ qty: newQty })
            .eq("id", loan.itemId);
          if (error) {
            console.error(error);
            return showToast("Could not restore stock.");
          }
        }

        const { error: delErr } = await supabaseClient
          .from("loans")
          .delete()
          .eq("id", loanId);
        if (delErr) {
          console.error(delErr);
          return showToast("Could not close the loan.");
        }

        loans = loans.filter((l) => l.id !== loanId);
        render();
        showToast("Returned — stock updated.");
      }

      function clearFilters() {
        $("searchInput").value = "";
        $("statusFilter").value = "";
        render();
      }

      $("searchInput").addEventListener("input", render);
      $("statusFilter").addEventListener("change", render);

      (async function init() {
        toast = new bootstrap.Toast($("toastMsg"), { delay: 3000 });
        await loadLoans();
        render();

        supabaseClient
          .channel("borrowers-changes")
          .on(
            "postgres_changes",
            { event: "*", schema: "public", table: "loans" },
            async () => {
              await loadLoans();
              render();
            },
          )
          .subscribe();
      })();
    </script>
  </body>
</html>
